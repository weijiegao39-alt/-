<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行者3.0</title><style>
body{margin:0;background:#070b16;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;padding-bottom:80px}header{position:sticky;top:0;background:#070b16ee;padding:14px;border-bottom:1px solid #263348;display:flex;justify-content:space-between}h1{margin:0;font-size:24px}p{color:#94a3b8}.page{display:none;padding:12px}.active{display:block}.card{background:#111827;border:1px solid #263348;border-radius:22px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#020617;border:1px solid #263348;border-radius:16px;padding:12px}.stat b{display:block;font-size:18px;margin-top:5px}.bar{height:10px;background:#020617;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#34d399}button,select,textarea,input{font:inherit}button{border:0;border-radius:14px;background:#1f2937;color:white;padding:12px;font-weight:700}select,input,textarea{width:100%;box-sizing:border-box;background:#020617;color:white;border:1px solid #334155;border-radius:12px;padding:10px;margin-top:6px}textarea{min-height:100px}.nav{position:fixed;bottom:0;left:0;right:0;background:#070b16ee;border-top:1px solid #263348;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.nav button{background:transparent;font-size:12px}.nav button.on{background:#12332c}.ok{border:1px solid #34d39955;background:#064e3b33;border-radius:14px;padding:12px}.warn{border:1px solid #fb718555;background:#7f1d1d33;border-radius:14px;padding:12px}.item{background:#020617;border:1px solid #263348;border-radius:16px;padding:12px;margin:8px 0}.map{border:1px solid #334155;border-radius:16px;padding:12px;margin:8px 0}.map.on{border-color:#34d399}pre{white-space:pre-wrap;background:#020617;border:1px solid #263348;border-radius:14px;padding:12px;max-height:420px;overflow:auto}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#020617;border:1px solid #334155;border-radius:14px;padding:12px}.hide{display:none}
</style></head><body>
<header><div><h1>旅行者3.0</h1><p>A7中枢城 · GPT悬赏版</p></div><button onclick="save()">保存</button></header>

<section id="home" class="page active"><div class="card"><h2>角色</h2><div class="grid">
<div class="stat">境界<b id="rank"></b></div><div class="stat">称号<b id="title"></b></div><div class="stat">年龄<b id="age"></b></div><div class="stat">性别<b>男</b></div><div class="stat">RP<b id="rp"></b></div><div class="stat">旅币<b id="coins"></b></div><div class="stat">A7资产<b id="asset"></b></div><div class="stat">体重<b id="weight"></b></div><div class="stat">稳定度<b id="stable"></b></div><div class="stat">幻影值SV<b id="sv"></b></div></div><p id="night"></p><div id="gate" class="ok"></div></div><div class="card"><h2>今日指挥台</h2><div class="ok">S级主线：投资研究工作｜72kg｜控制欲望与幻想。<br>核心警告：能力增长速度不能低于资金增长速度。</div></div></section>

<section id="daily" class="page"><div class="card"><h2>日报结算</h2><div class="grid" id="dailyForm"></div><label>研究分钟<input id="study" type="number" value="0"></label><label>备注<textarea id="note"></textarea></label><button onclick="settle()">生成地下城战报</button></div></section>

<section id="quick" class="page"><div class="card"><h2>快捷操作</h2><div class="grid">
<button onclick="act('research')">📘 研究输出 +5RP</button><button onclick="act('data')">🗄️ 数据更新 +4RP</button><button onclick="act('sport')">🏃 运动30分钟</button><button onclick="act('skin')">🧴 护肤完成</button><button onclick="act('sleep')">🌙 熄屏达标</button><button onclick="act('anchor')">🧭 现实锚定</button><button onclick="act('red')">📉 市场红色</button><button onclick="act('shadow')">🌫️ 幻影攻击</button><button onclick="act('ai')">🤖 AI依赖</button><button onclick="assetUpdate()">💰 更新A7资产</button></div></div></section>

<section id="bounty" class="page"><div class="card"><h2>GPT任务悬赏接口</h2><div class="ok">填今日状态 → 生成任务请求 → 复制给GPT → 让GPT发布今日悬赏任务。</div><label>今日精力<select id="energy"><option>低</option><option selected>中</option><option>高</option></select></label><label>可用时间<select id="time"><option>30分钟</option><option selected>1小时</option><option>2小时</option><option>3小时以上</option></select></label><label>主风险<select id="risk"><option>赖床</option><option>看盘上头</option><option selected>欲望/幻想</option><option>拖延</option><option>情绪低落</option><option>暴食</option></select></label><label>场景<select id="scene"><option>在家</option><option selected>上班/商场</option><option>学校</option><option>外出</option><option>独处夜晚</option></select></label><label>额外说明<textarea id="bnote"></textarea></label><button onclick="makeBounty()">生成悬赏请求</button><pre id="bout"></pre><button onclick="copyBounty()">复制</button></div></section>

<section id="map" class="page"><div class="card"><h2>地图探索</h2><label>天气<select id="weather"></select></label><label>当前地图<select id="mapSel"></select></label><p id="mapDesc"></p><div class="ok">混沌因子：<b id="chaos"></b><p id="chaosD"></p><button onclick="reroll()">重抽</button></div></div><div class="card"><h2>副本与彩蛋</h2><div id="maps"></div></div></section>

<section id="more" class="page"><div class="card"><h2>更多</h2><div class="grid"><button onclick="showBoss()">👹 Boss</button><button onclick="showBag()">🎒 仓库</button><button onclick="showLog()">📜 日志</button><button onclick="setWeight()">⚖️ 更新体重</button><button onclick="act('review')">✅ 红色复盘</button><button onclick="act('echo')">🌫️ 回响碎片</button></div><pre id="moreBox"></pre></div></section>

<nav class="nav"><button class="on" onclick="go('home',this)">首页</button><button onclick="go('daily',this)">日报</button><button onclick="go('quick',this)">快捷</button><button onclick="go('bounty',this)">悬赏</button><button onclick="go('map',this)">地图</button></nav><div id="toast" class="toast hide"></div>

<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],fmt=n=>Number(n).toLocaleString("zh-CN"),rand=a=>a[Math.floor(Math.random()*a.length)];
const R=[["行者",0,79],["勇士",80,159],["先驱",160,259],["礁石",260,379],["先知",380,999999]];
const W={"晴天":"适合出门、运动、放下手机。","多云":"适合控盘、稳态学习。","雨天":"适合深推、复盘、输出。","雪天":"适合恢复、降温、夜潮守线。","雷雨":"高风险日，防冲动、防熬夜。"};
const M={"晨雾平原":"起床与身体主权。彩蛋：连续3天不赖床，解锁【破晓行者】。","熔炉营地":"运动、减脂、护肤。彩蛋：75kg开启轻身祝福。","群星研究院":"行业研究、财报、数据。彩蛋：7次300字输出，解锁【书库点灯人】。","星港交易所":"投资纪律、看盘、复盘。彩蛋：5天看盘≤2h，市场先生HP-10。","回响档案馆":"旧照片、怀旧、回响碎片。彩蛋：30天不AI生成旧人照片，旧日幻影HP-20。","夜潮回廊":"欲望、幻想、熄屏。彩蛋：SV归零，获得【静海徽记】。","风行驿站":"关系、社交、现实连接。彩蛋：3次现实社交，掉落社交通行证。","浪花码头":"浪花账、旅行、奖励兑现。彩蛋：不冲动消费7天，获得冷却豁免权。","黑曜城墙":"危机门禁。彩蛋：红色复盘3次，解锁【不爆仓者】。"};
const C=[["禁糖日","今日不喝含糖饮料。"],["静默散步","关手机听音乐散步20分钟。"],["短视频封印","今日不看短视频。"],["禁触发器","今日不碰熟人照片/动态触发器。"],["压盘日","今日看盘主动降频。"],["匠火暴击","今日第一次研究输出收益翻倍。"],["旧日低语","谨慎打开相册。"],["数据矿脉","适合更新数据库。"]];
const OPT={sleep:["优：00:30前 +3RP","良：01:30前 +1RP","差：01:30后 -3RP"],watch:["优：≤2h +3RP","良：2-4h 0RP","差：>4h -5RP","红色：>6h 市场先生降临"],research:["优：输出300字以上 +5RP","良：只阅读 +2RP","差：只看盘不研究 -5RP"],ai:["优：AI辅助但自己理解 +5RP","良：AI完成50% 0RP","差：AI完成90%且讲不出 -10RP"],desire:["优：本周≤1次 +5RP","良：本周2-3次 0RP","差：本周≥4次 -5RP"],shadow:["无","看旧照片 +3SV","AI修改/生成照片 +5SV","幻想超过15分钟 +5SV"],sport:["无","运动30分钟 +3RP","运动60分钟 +5RP"],care:["无","护肤","眼睛保护","护肤+眼睛保护"]};
let S=JSON.parse(localStorage.getItem("traveler30-simple")||"null")||{rp:0,coins:20,asset:580000,title:"初级试炼者",weather:"晴天",map:"群星研究院",chaos:rand(C),stable:70,poll:0,sv:0,night:0,pity:0,freeze:0,weight:78,data:0,inv:{"旅行碎片":0,"社交通行证":0,"回响碎片":2,"冷却豁免权":0},boss:{市场先生:100,伪研究员:100,欲望魔神:100,旧日幻影:100},logs:["【启动】旅行者3.0 已载入。"]};
function save(){localStorage.setItem("traveler30-simple",JSON.stringify(S));toast("已保存")}
function toast(t){$("#toast").textContent=t;$("#toast").classList.remove("hide");setTimeout(()=>$("#toast").classList.add("hide"),2000)}
function log(t){S.logs.push(`[${new Date().toLocaleTimeString()}] ${t}`);save();render()}
function age(){let b=new Date(2002,11,25),n=new Date(),y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=30}if(m<0){y--;m+=12}return `${y}岁${m}个月${d}天`}
function rank(){return R.find(x=>S.rp>=x[1]&&S.rp<=x[2])||R[4]}
function go(id,btn){$$(".page").forEach(p=>p.classList.remove("active"));$("#"+id).classList.add("active");$$(".nav button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");render()}
function init(){Object.entries(OPT).forEach(([k,v])=>{let l=document.createElement("label");l.textContent=k;let s=document.createElement("select");s.id=k;v.forEach(x=>s.add(new Option(x,x)));l.appendChild(s);$("#dailyForm").appendChild(l)});Object.keys(W).forEach(x=>weather.add(new Option(x,x)));Object.keys(M).forEach(x=>mapSel.add(new Option(x,x)));weather.onchange=()=>{S.weather=weather.value;render()};mapSel.onchange=()=>{S.map=mapSel.value;render()};render()}
function render(){let r=rank();rank_el=r;$("#rank").textContent=r[0];$("#title").textContent=S.title;$("#age").textContent=age();$("#rp").textContent=`${S.rp}/${r[2]}`;$("#coins").textContent=S.coins;$("#asset").textContent="¥"+fmt(S.asset);$("#weight").textContent=S.weight+"kg";$("#stable").textContent=S.stable+"/100";$("#sv").textContent=S.sv+"/100";$("#night").textContent=`夜潮印记 ${S.night}/7｜保底 ${S.pity}/3｜回响碎片 ${S.inv["回响碎片"]}`;$("#gate").textContent=Date.now()<S.freeze?"强门禁冻结中":"强门禁：未开启";weather.value=S.weather;mapSel.value=S.map;$("#mapDesc").textContent=M[S.map]+" 天气："+W[S.weather];$("#chaos").textContent=S.chaos[0];$("#chaosD").textContent=S.chaos[1];$("#maps").innerHTML=Object.keys(M).map(k=>`<div class="map ${S.map==k?'on':''}" onclick="S.map='${k}';log('【地图切换】进入${k}')"><b>${k}</b><p>${M[k]}</p></div>`).join("")}
function act(a){if(a=="research"){S.rp+=5;S.coins+=3;S.boss.伪研究员-=20;S.sv=Math.max(0,S.sv-3);log("【研究输出】+5RP")}if(a=="data"){S.rp+=4;S.data++;log("【数据更新】+4RP")}if(a=="sport"){S.rp+=3;S.sv=Math.max(0,S.sv-5);log("【运动】SV-5")}if(a=="skin"){S.rp+=1;S.night++;log("【护肤】夜潮+1")}if(a=="sleep"){S.rp+=3;S.night++;log("【熄屏】+3RP")}if(a=="anchor"){S.sv=Math.max(0,S.sv-5);S.stable+=3;log("【现实锚定】SV-5")}if(a=="red"){S.rp=Math.max(0,S.rp-8);S.freeze=Date.now()+864e5;S.boss.市场先生=100;log("【市场红色】禁止加仓")}if(a=="shadow"){S.rp=Math.max(0,S.rp-2);S.sv+=5;log("【旧日幻影】SV+5")}if(a=="ai"){S.rp=Math.max(0,S.rp-10);S.boss.伪研究员+=20;log("【AI依赖】RP-10")}if(a=="review"){S.freeze=0;S.rp+=5;S.boss.市场先生-=25;log("【红色复盘】门禁解除")}if(a=="echo"){if(S.inv["回响碎片"]>0){S.inv["回响碎片"]--;log("【回响碎片】允许30分钟怀旧")}else{S.rp-=3;S.sv+=5;log("【越界怀旧】")}}save();render()}
function settle(){let add=+$("#study").value>=30?3:0;S.rp+=add;let note=$("#note").value;log(`【日结】地图：${S.map}｜研究分钟：${$("#study").value}｜${note}`);$("#note").value=""}
function reroll(){S.chaos=rand(C);log("【混沌因子】"+S.chaos[0])}
function assetUpdate(){let v=prompt("输入当前A7资产",S.asset);if(v){S.asset=+v;log("【A7资产】更新")}}
function setWeight(){let v=prompt("输入体重kg",S.weight);if(v){S.weight=+v;if(S.weight<=72){S.title="旅行者·轻身";S.rp+=50}log("【体重更新】"+S.weight)}}
function showBoss(){moreBox.textContent=JSON.stringify(S.boss,null,2)}
function showBag(){moreBox.textContent=JSON.stringify(S.inv,null,2)}
function showLog(){moreBox.textContent=S.logs.slice(-80).join("\\n")}
function makeBounty(){let obj={生日:"2002-12-25",性别:"男",年龄:age(),境界:rank()[0],RP:S.rp,体重:S.weight,A7资产:S.asset,稳定度:S.stable,幻影值SV:S.sv,夜潮:S.night+"/7",地图:S.map,天气:S.weather,混沌因子:S.chaos[0],Boss:S.boss,背包:S.inv,今日精力:energy.value,可用时间:time.value,主风险:risk.value,场景:scene.value,说明:bnote.value,请求:"请为我发布今日具体任务悬赏：主线、支线、限时、禁止事项、奖励、惩罚、Boss攻击、地图剧情、最低保底。围绕投资研究、减脂、控欲、睡眠、看盘纪律。"};bout.textContent="【旅行者3.0｜今日任务悬赏请求】\\n"+JSON.stringify(obj,null,2)}
function copyBounty(){navigator.clipboard.writeText(bout.textContent);toast("已复制")}
init();
</script></body></html>
