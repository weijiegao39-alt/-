<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],fmt=n=>Number(n).toLocaleString('zh-CN'),rand=a=>a[Math.floor(Math.random()*a.length)];
const RANKS=[['行者',0,79],['勇士',80,159],['先驱',160,259],['礁石',260,379],['先知',380,999999]];

const SHOP=[['咖啡/奶茶',20],['电影',40],['轻娱乐30分钟',30],['外食升级',60],['火锅',80],['买书',50],['小配饰',100],['正式纪念品',200]],TRAVEL=[['省内侦察开图',2],['省内半日',8],['省内一日',15],['两日一夜',25],['跨国短途',80],['远行远征',120]];
let S=JSON.parse(localStorage.getItem('traveler36')||'null')||{rp:174,coins:120,asset:1050000,title:'资本旅者',weather:'晴天',map:'群星研究院',chaos:rand(CHAOS),stable:70,poll:0,sv:0,night:0,pity:0,freeze:0,weight:78,data:0,undo:[],inv:{'旅行碎片':5,'社交通行证':0,'回响碎片':2,'冷却豁免权':1,'神秘钥匙':0},boss:{'市场先生':100,'伪研究员':100,'欲望魔神':100,'旧日幻影':100},ach:['A7突破者'],logs:['【系统启动】旅行者3.6 地下城版载入。','【A7突破】资产达到 ¥1,050,000，获得称号：资本旅者。']};
function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem('traveler36',JSON.stringify(S));toast('已保存')}function pushUndo(reason){let old=clone(S);old.undo=[];S.undo=S.undo||[];S.undo.push({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),reason,data:old});if(S.undo.length>20)S.undo.shift()}function undoLast(){if(!S.undo||!S.undo.length)return toast('没有可撤销动作');let last=S.undo.pop(),stack=S.undo;S=last.data;S.undo=stack;S.logs.push(`【撤销】${last.reason}｜${last.time}`);save();render();toast('已撤销')}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2300)}function log(t){S.logs.push(`[${new Date().toLocaleTimeString('zh-CN',{hour12:false})}] ${t}`);save();render()}function today(){let n=new Date(),w='日一二三四五六'[n.getDay()];return `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日｜星期${w}`}function age(){let b=new Date(2002,11,25),n=new Date(),y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return `${y}岁${m}个月${d}天`}function rank(){return RANKS.find(x=>S.rp>=x[1]&&S.rp<=x[2])||RANKS[4]}function assetStage(){let a=S.asset;if(a>=3000000)return['A10',3000000,3000000];if(a>=2000000)return['A9',2000000,3000000];if(a>=1500000)return['A8',1500000,2000000];if(a>=1000000)return['A7',1000000,1500000];if(a>=800000)return['A6',800000,1000000];return['A5',500000,800000]}function go(id){$$('.page').forEach(p=>p.classList.toggle('active',p.id===id));$$('.bn').forEach((b,i)=>b.classList.toggle('active',['home','daily','quick','bounty','more'][i]===id));scrollTo({top:0,behavior:'smooth'});render()}
function init(){Object.entries(OPT).forEach(([k,v])=>{let l=document.createElement('label');l.textContent={sleep:'睡眠',watch:'看盘',research:'研究',ai:'AI依赖',desire:'欲望',shadow:'旧照/幻想',sport:'运动',care:'护肤/眼睛'}[k];let s=document.createElement('select');s.id=k;v.forEach(x=>s.add(new Option(x,x)));l.appendChild(s);$('#dailyForm').appendChild(l)});Object.keys(WEATHER).forEach(x=>weather.add(new Option(x,x)));Object.keys(MAPS).forEach(x=>mapSel.add(new Option(x,x)));weather.onchange=()=>{S.weather=weather.value;render();save()};mapSel.onchange=()=>{S.map=mapSel.value;render();save()};render()}
function render(){let r=rank(),st=assetStage(),rpPct=(S.rp-r[1])/(r[2]-r[1])*100,assetPct=(S.asset-st[1])/(st[2]-st[1])*100;$('#rank').textContent=r[0];$('#title').textContent=S.title;$('#dateLine').textContent=today();$('#age').textContent=age();$('#rp').textContent=`${S.rp}/${r[2]==999999?'∞':r[2]}`;$('#coins').textContent=S.coins;$('#asset').textContent='¥'+fmt(S.asset);$('#gap').textContent=st[0]=='A10'?'已封顶':'¥'+fmt(st[2]-S.asset);$('#weight').textContent=S.weight+'kg';$('#stable').textContent=S.stable+'/100';$('#sv').textContent=S.sv+'/100';$('#assetText').textContent=`资产阶段：${st[0]}｜${st[0]=='A10'?'终局阶段':'下一阶段进度'}`;$('#assetBar').style.width=Math.max(0,Math.min(100,assetPct))+'%';$('#rpText').textContent=`境界进度：${r[0]} ${Math.max(0,Math.min(100,rpPct)).toFixed(0)}%`;$('#rpBar').style.width=Math.max(0,Math.min(100,rpPct))+'%';$('#nightText').textContent=`夜潮印记 ${S.night}/7｜保底 ${S.pity}/3｜回响碎片 ${S.inv['回响碎片']||0}`;$('#nightBar').style.width=Math.min(100,S.night/7*100)+'%';$('#gate').textContent=Date.now()<S.freeze?'强门禁冻结中：禁止加仓/浪花账/旅行':'强门禁：未开启';$('#gate').className='ok gate '+(Date.now()<S.freeze?'bad':'');weather.value=S.weather;mapSel.value=S.map;$('#mapDesc').textContent=MAPS[S.map][1]+' 天气：'+WEATHER[S.weather];$('#chaos').textContent=S.chaos[0];$('#chaosD').textContent=S.chaos[1];$('#maps').innerHTML=Object.keys(MAPS).map(k=>`<div class="mapcard ${S.map==k?'active':''}" onclick="pushUndo('地图切换');S.map='${k}';log('【地图切换】进入${k}')"><h3>${k}</h3><div class="meta">${MAPS[k][0]}</div><p>${MAPS[k][1]}</p></div>`).join('');renderBoss()}function renderBoss(){let html=Object.entries(S.boss).map(([k,v])=>`<div class="item"><h3>${k}</h3><div class="meta">HP ${v}/100</div><div class="bar ${k=='旧日幻影'?'purple':'red'}"><i style="width:${v}%"></i></div><p>${bossDesc(k)}</p><button onclick="pushUndo('压制${k}');S.boss['${k}']=Math.max(0,S.boss['${k}']-10);log('【Boss压制】${k}-10HP')">压制</button></div>`).join('');$('#bossMini').innerHTML=html;$('#bossGrid').innerHTML=html}function bo function settle(){pushUndo('日报结算');let add=0,L=[],studyMin=+study.value;if(sleep.value.startsWith('优')){add+=3;S.night++;L.push('睡眠优')}else if(sleep.value.startsWith('良')){add+=1;L.push('睡眠良')}else{add-=3;S.poll=Math.min(100,S.poll+5);L.push('睡眠差')}if(watch.value.startsWith('优')){add+=3;S.boss['市场先生']=Math.max(0,S.boss['市场先生']-8);L.push('看盘优')}else if(watch.value.startsWith('差')){add-=5;L.push('看盘过久')}else if(watch.value.startsWith('红色')){S.freeze=Date.now()+864e5;S.boss['市场先生']=100;add-=8;L.push('市场先生降临')}if(research.value.startsWith('优')){add+=5;S.boss['伪研究员']=Math.max(0,S.boss['伪研究员']-20);L.push('研究输出')}else if(research.value.startsWith('良'))add+=2;else add-=5;if(ai.value.startsWith('优'))add+=5;else if(ai.value.startsWith('差'))add-=10;if(desire.value.startsWith('优'))add+=5;else if(desire.value.startsWith('差'))add-=5;if(shadow.value.includes('旧照片'))S.sv+=3;if(shadow.value.includes('AI')||shadow.value.includes('幻想'))S.sv+=5;if(sport.value.includes('30')){add+=3;S.sv=Math.max(0,S.sv-5)}if(sport.value.includes('60')){add+=5;S.sv=Math.max(0,S.sv-8)}if(care.value!='无'){add+=1;S.night++}if(studyMin>=90)S.sv=Math.max(0,S.sv-8);else if(studyMin>=30)S.sv=Math.max(0,S.sv-3);S.rp=Math.max(0,S.rp+add);let coin=Math.max(0,Math.floor(add/2));S.coins+=coin;S.stable=Math.max(0,Math.min(100,S.stable+(add>0?2:-3)));log(`【地下城日结】进入《${S.map}》\n- ${L.join('\n- ')}\n备注：${note.value}\n合计：RP ${add>=0?'+':''}${add}｜旅币+${coin}`);note.value='';if(S.pity>=3&&studyMin>=10)drop(true);else if(Math.random()<.25)drop(false);else S.pity++;nightCheck();save();render()}function drop(force){let d=force?rand(['旅行碎片','开图碎片']):rand(['旅币+2','旅行碎片','社交通行证','神秘钥匙']);if(d=='旅币+2')S.coins+=2;else S.inv[d]=(S.inv[d]||0)+1;S.pity=0;showDrop(force?'保底大爆':'随机掉落',d);log('【掉落】'+d)}function reroll(){pushUndo('重抽混沌因子');S.chaos=rand(CHAOS);log('【混沌因子】'+S.chaos[0])}function assetUpdate(){pushUndo('资产更新');let old=S.asset,v=prompt('输入当前总资产',S.asset);if(v!==null&&v!==''){S.asset=+v;let diff=S.asset-old;log(`【资产更新】¥${fmt(o /* 旅行者3.7｜盈利阶段重构补丁：粘贴到 index.html 里 init(); 上方 */
(function(){
  if(!S) return;
  S.version = 37;
  S.asset = Number(S.asset || 1050000);
  S.principal = Number(S.principal || 650000);
  S.title = S.title || "资本旅者";

  S.inv = S.inv || {};
  S.logs = S.logs || [];

  if(!S.ach.includes("盈利40万")) S.ach.push("盈利40万");

  window.profit = function(){

  };

  window.assetStage = function(){

    if(p >= 5000000) return ["P10 盈利500万",5000000,10000000];
    if(p >= 2000000) return ["P9 盈利200万",2000000,5000000];
    if(p >= 1000000) return ["P8 盈利100万",1000000,2000000];
    if(p >= 800000) return ["P7 盈利80万",800000,1000000];
    if(p >= 600000) return ["P6 盈利60万",600000,800000];
    if(p >= 400000) return ["P5 盈利40万",400000,600000];
    if(p >= 200000) return ["P4 盈利20万",200000,400000];
    if(p >= 100000) return ["P3 盈利10万",100000,200000];
    return ["P2 盈利积累期",0,100000];
  };

  window.assetUpdate = function(){
    if(typeof pushUndo === "function") pushUndo("资产/本金更新");
    const oldAsset = Number(S.asset || 0);
    const oldPrincipal = Number(S.principal || 0);
    const newAsset = prompt("输入当前总资产", oldAsset);
    if(newAsset === null) return;
    const newPrincipal = prompt("输入当前本金/累计投入", oldPrincipal);
    if(newPrincipal === null) return;
    S.asset = Number(newAsset || 0);
    S.principal = Number(newPrincipal || 0);
    const p = profit();
    log(`【资产更新】总资产 ¥${fmt(oldAsset)} → ¥${fmt(S.asset)}｜本金 ¥${fmt(S.principal)}｜盈利约 ¥${fmt(p)}`);

      S.ach.push("盈利百万");
      S.coins = (S.coins || 0) + 300;
      S.inv["旅行碎片"] = (S.inv["旅行碎片"] || 0) + 10;
      log("【盈利百万】解锁：旅币+300｜旅行碎片+10");
    }
    save();
    render();
  };

  const oldRender37 = window.render;
  window.render = function(){
    oldRender37();
    const p = profit();
    const st = assetStage();

    // 替换首页资产显示逻辑：总资产、本金、盈利、距下阶段
    const assetBox = document.getElementById("asset");
    if(assetBox) assetBox.textContent = "¥" + fmt(S.asset);

    let principalBox = document.getElementById("principal");

      const grid = document.querySelector(".hero .grid") || document.querySelector(".grid");
      if(grid){
        const div = document.createElement("div");
        div.className = "stat";
        div.innerHTML = '<span>本金/投入</span><b id="principal"></b>';
        grid.appendChild(div);
        principalBox = document.getElementById("principal");

    }
    if(principalBox) principalBox.textContent = "¥" + fmt(S.principal);

    let profitBox = document.getElementById("profit");
    if(!profitBox){
      const grid = document.querySelector(".hero .grid") || document.querySelector(".grid");
      if(grid){
        const div = document.createElement("div");
        div.className = "stat";
        div.innerHTML = '<span>当前盈利</span><b id="profit"></b>';
        grid.appendChild(div);
        profitBox = document.getElementById("profit");
      }
    }
    if(profitBox) profitBox.textContent = "¥" + fmt(p);

    const gapEl = document.getElementById("gap") || document.getElementById("assetGap") || document.getElementById("nextAsset");

    const assetText = document.getElementById("assetText") || document.getElementById("a7Text");
    if(assetText) assetText.textContent = `盈利阶段：${st[0]}｜下一阶段进度`;

    const assetBar = document.getElementById("assetBar") || document.getElementById("a7bar");

      assetBar.style.width = pct + "%";

  };

  if(!S.logs.some(x=>String(x).includes("旅行者3.7"))){
    S.logs.push("【系统升级】旅行者3.7：资产系统改为盈利阶段，本金/投入字段已启用。当前总资产105万，本金约65万，盈利约40万。");
  }
  localStorage.setItem("traveler36", JSON.stringify(S));
  localStorage.setItem("traveler37", JSON.stringify(S));
})();

init();
