<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TravelerOS">
<title>TravelerOS 6.0｜Mission Control</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#07111f;--card:#101b2d;--deep:#020617;--line:#293a54;--txt:#e5e7eb;--muted:#94a3b8;--g:#34d399;--b:#38bdf8;--r:#fb7185;--y:#facc15;--p:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#07111f,#020617);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;padding-bottom:92px}
header{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{margin:0;font-size:21px}h2{margin:0 0 12px;font-size:18px}h3{margin:0 0 7px;font-size:16px}p{line-height:1.55}.sub,.muted,.label{color:var(--muted);font-size:13px}
main{max-width:720px;margin:auto;padding:12px}.page{display:none;gap:12px}.page.active{display:grid}
.card{background:linear-gradient(180deg,rgba(16,27,45,.98),rgba(7,16,29,.98));border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.hero{min-height:340px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 88% 5%,rgba(56,189,248,.28),transparent 35%),linear-gradient(180deg,#14233d,#07101d)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.right{text-align:right}.big{font-size:31px;font-weight:950;line-height:1.15}.center{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:rgba(2,6,23,.78);border:1px solid var(--line);border-radius:17px;padding:11px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:5px;font-size:17px}
.bar{height:11px;background:#020617;border:1px solid #263348;border-radius:999px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#059669,#34d399);transition:.35s}.red i{background:linear-gradient(90deg,#be123c,#fb7185)}.yellow i{background:linear-gradient(90deg,#ca8a04,#facc15)}.purple i{background:linear-gradient(90deg,#6d28d9,#a78bfa)}
button,select,input,textarea{font:inherit}button{border:0;border-radius:15px;background:#1f2937;color:white;padding:12px 14px;font-weight:850;min-height:45px}button:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,#047857,#10b981);width:100%;margin-top:10px}.danger{background:#7f1d1d}.ghost{background:#0f172a;border:1px solid var(--line)}.wide{width:100%;margin-top:8px}
select,input,textarea{width:100%;background:#020617;color:white;border:1px solid #334155;border-radius:13px;padding:11px;margin-top:6px;min-height:44px}textarea{min-height:92px}
.ok{border:1px solid rgba(52,211,153,.28);background:rgba(5,150,105,.08);border-radius:15px;padding:11px;line-height:1.55}.warn{border:1px solid rgba(251,113,133,.35);background:rgba(127,29,29,.22);color:#fecdd3;border-radius:15px;padding:11px;line-height:1.55}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.app{background:#08111f;border:1px solid var(--line);border-radius:18px;padding:9px;text-align:center;min-height:76px}.app i{display:block;font-size:23px}.app span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.task,.record,.map,.boss,.npc,.choice{background:#08111f;border:1px solid var(--line);border-radius:18px;padding:13px;margin:8px 0}.task.done{opacity:.6;border-color:#14532d}.task.current{border-color:var(--g);box-shadow:0 0 0 1px rgba(52,211,153,.25)}.meta{color:var(--y);font-size:13px;margin:5px 0}
.pill{display:inline-block;border:1px solid var(--line);background:#08111f;border-radius:99px;padding:5px 9px;color:#cbd5e1;font-size:12px;margin:3px}
pre{white-space:pre-wrap;background:#020617;border:1px solid var(--line);border-radius:15px;padding:12px;max-height:460px;overflow:auto;font-size:13px;line-height:1.55}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,17,31,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bottom button{background:transparent;color:#cbd5e1;border-radius:13px;font-size:12px;padding:7px 2px;min-height:50px}.bottom button.active{background:#12332c;color:#fff}.bottom span{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#020617;border:1px solid var(--line);border-radius:16px;padding:13px;z-index:50;max-width:90vw}.hide{display:none}
.timer{font-size:44px;font-weight:950;text-align:center;margin:12px 0}.lockscreen{filter:grayscale(.7);opacity:.8}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.apps{grid-template-columns:repeat(4,1fr)}.big{font-size:29px}}
</style>
</head>
<body>
<header>
  <div><h1>TravelerOS 6.0</h1><div class="sub">三秒原则｜主线导航 · 止血 · 决策室</div></div>
  <button id="saveBtn">保存</button>
</header>

<main>
<section id="home" class="page active">
  <article class="card hero" id="hero">
    <div>
      <div class="row">
        <div><div class="label">现在该做什么</div><div id="heroTitle" class="big"></div></div>
        <div class="right"><div id="today" class="label"></div><b id="mode"></b></div>
      </div>
      <p id="heroDesc" class="muted"></p>
      <div id="heroTags"></div>
    </div>
    <div>
      <button id="startBtn" class="primary">开始</button>
      <button id="doneBtn" class="ghost wide">我做完了</button>
      <button id="dontKnowBtn" class="ghost wide">我现在不知道干嘛</button>
    </div>
  </article>

  <article class="card">
    <h2>追踪五条线</h2>
    <div class="grid">
      <div class="stat"><span>燃机主线</span><b id="mainPct"></b></div>
      <div class="stat"><span>欲望系统</span><b id="desirePct"></b></div>
      <div class="stat"><span>心态稳定</span><b id="mindPct"></b></div>
      <div class="stat"><span>投资纪律</span><b id="tradePct"></b></div>
      <div class="stat"><span>身体锚定</span><b id="bodyPct"></b></div>
      <div class="stat"><span>本周🦌</span><b id="weekD"></b></div>
    </div>
  </article>

  <article class="card">
    <h2>入口</h2>
    <div class="apps">
      <button class="app" data-go="mission"><i>⚔️</i><b>主线</b><span>燃机/PPT</span></button>
      <button class="app" data-go="bleed"><i>🧯</i><b>止血</b><span>20分钟</span></button>
      <button class="app" data-go="decision"><i>🚪</i><b>决策</b><span>冲动前</span></button>
      <button class="app" data-go="daily"><i>📝</i><b>日报</b><span>10秒</span></button>
      <button class="app" data-go="archive"><i>📚</i><b>档案</b><span>历史</span></button>
      <button class="app" data-go="npc"><i>🧙</i><b>NPC</b><span>一句话</span></button>
      <button class="app" data-go="boss"><i>👹</i><b>Boss</b><span>血条</span></button>
      <button class="app" data-go="gpt"><i>🤖</i><b>GPT</b><span>悬赏</span></button>
    </div>
  </article>
</section>

<section id="mission" class="page"><article class="card"><h2>主线：燃气轮机数据库 & PPT</h2><div class="ok">目标：能讲清、能答辩、能被追问。数据库不塞进软件，软件只负责推你每天前进。</div><div id="missionList"></div></article></section>

<section id="bleed" class="page"><article class="card"><h2>止血模式</h2><div class="warn">AI改图、幻想扩建、🦌、看盘翻本、爆仓后上头，进入这里。</div><div id="timer" class="timer">20:00</div><div id="bleedSteps"></div><button id="startBleed" class="primary">启动20分钟</button><button id="recordRelapse" class="danger wide">记录失控一次</button></article></section>

<section id="decision" class="page"><article class="card"><h2>决策室</h2><div class="ok">冲动和行动之间插一扇门。</div><div class="grid"><button class="decision" data-type="ai">想AI改图</button><button class="decision" data-type="desire">想🦌</button><button class="decision" data-type="trade">想翻本/加仓</button><button class="decision" data-type="lazy">想摆烂</button></div><pre id="decisionOut"></pre></article></section>

<section id="daily" class="page"><article class="card"><h2>10秒日报</h2>
<label>今天研究了吗？<select id="r"><option>无</option><option>阅读</option><option>输出300字</option><option>更新数据库/PPT</option><option>能讲清一个模块</option></select></label>
<label>今天🦌？<select id="d"><option>0次</option><option>1次</option><option>2次</option><option>3次</option><option>4次及以上</option></select></label>
<label>AI改图/幻想？<select id="f"><option>无</option><option>想了但停住</option><option>旧照/幻想15分钟内</option><option>AI改图/扩建幻想</option><option>严重失控</option></select></label>
<label>投资心态？<select id="t"><option>无交易</option><option>正常看盘</option><option>看盘过久</option><option>冲动交易/想翻本</option></select></label>
<label>身体锚定？<select id="b"><option>无</option><option>离屏20分钟</option><option>运动30分钟</option><option>运动60分钟</option></select></label>
<label>一句真实记录<textarea id="note" placeholder="真实就行，不用漂亮。"></textarea></label>
<button id="settle" class="primary">提交日报</button>
</article></section>

<section id="archive" class="page"><article class="card"><h2>档案馆</h2><div class="grid"><div class="stat"><span>累计日报</span><b id="total"></b></div><div class="stat"><span>连续止血</span><b id="streak"></b></div><div class="stat"><span>本周研究</span><b id="weekR"></b></div><div class="stat"><span>SV幻影值</span><b id="sv"></b></div></div><div id="records"></div></article></section>

<section id="npc" class="page"><article class="card"><h2>NPC大厅</h2><div id="npcLine" class="npc"></div><button id="askNpc" class="primary">今日一句</button></article></section>
<section id="boss" class="page"><article class="card"><h2>Boss大厅</h2><div id="bossList"></div></article></section>
<section id="gpt" class="page"><article class="card"><h2>GPT悬赏大厅</h2><label>补充<textarea id="gptNote"></textarea></label><button id="makeGpt" class="primary">生成请求</button><pre id="gptOut"></pre><button id="copyGpt">复制</button></article></section>
</main>

<nav class="bottom">
  <button class="nav active" data-go="home"><span>🏠</span>主页</button>
  <button class="nav" data-go="mission"><span>⚔️</span>主线</button>
  <button class="nav" data-go="bleed"><span>🧯</span>止血</button>
  <button class="nav" data-go="decision"><span>🚪</span>决策</button>
  <button class="nav" data-go="archive"><span>📚</span>档案</button>
</nav>
<div id="toast" class="toast hide"></div>

<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),KEY="traveler60";
function def(){return{mode:"修复模式",rp:0,sv:25,risk:70,streak:0,now:0,timer:null,asset:1050000,principal:750000,records:[],logs:[],main:[["供给端：叶片/热端件","高温合金、叶片、燃烧室、机匣、良率/产能/瓶颈",0],["需求端：调峰/新增/替换","调峰、新增装机、存量替换、AIDC，能说清驱动",0],["公司对比","应流/东方电气/杰瑞/海外PCC/Howmet等，字段可追踪",0],["估值框架","利润预测、PE、周期性、订单确认、毛利率路径",0],["PPT答辩","10分钟能讲清，能回答3个追问",0]],boss:{"高刺激循环":90,"欲望魔神":85,"市场先生":80,"伪研究员":70,"旧日幻影":75}}}
let S=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||def()}catch(e){return def()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(x){$("#toast").textContent=x;$("#toast").classList.remove("hide");setTimeout(()=>$("#toast").classList.add("hide"),1800)}
function today(){let n=new Date(),w="日一二三四五六"[n.getDay()];return `${n.getMonth()+1}.${n.getDate()} 周${w}`}
function wk(){let r=S.records.slice(-7);return{d:r.reduce((a,x)=>a+x.d,0),res:r.reduce((a,x)=>a+(x.rs>0?1:0),0)}}
function pct(){return Math.round(S.main.reduce((a,x)=>a+x[2],0)/S.main.length)}
function current(){let arr=[];if(S.risk>65||S.sv>35)arr.push(["离屏20分钟","先把身体从屏幕里拔出来，不讨论。","止血"]);arr.push(["燃机研究40分钟","只推进一个模块：供给/需求/公司/估值/PPT任选。","主线"]);arr.push(["写三句话","推进了什么、卡在哪里、下一步是什么。","档案"]);arr.push(["今晚不AI改图","旧照进档案馆，不生产新幻想素材。","防线"]);return arr[S.now%3]}
function render(){let w=wk(),c=current();$("#today").textContent=today();$("#mode").textContent=S.mode;$("#heroTitle").textContent=c[0];$("#heroDesc").textContent=c[1];$("#heroTags").innerHTML=`<span class="pill">${c[2]}</span><span class="pill">预计20-40min</span>`;$("#mainPct").textContent=pct()+"%";$("#mainBar").style.width=pct()+"%";$("#desirePct").textContent=clamp(100-S.sv,0,100)+"%";$("#mindPct").textContent=clamp(100-S.risk,0,100)+"%";$("#tradePct").textContent=clamp(100-S.boss["市场先生"],0,100)+"%";$("#bodyPct").textContent=S.streak>0?Math.min(100,S.streak*10)+"%":"0%";$("#weekD").textContent=w.d+"次";$("#weekR").textContent=w.res+"次";$("#sv").textContent=S.sv+"/100";$("#missionList").innerHTML=S.main.map((x,i)=>`<div class="task"><h3>${x[0]}｜${x[2]}%</h3><p>${x[1]}</p><div class="bar"><i style="width:${x[2]}%"></i></div><button onclick="upMain(${i})">推进10%</button></div>`).join("");$("#bleedSteps").innerHTML=["手机离手2米","站起来喝水/洗脸","下楼或走动20分钟","回来只打开燃机主线"].map((x,i)=>`<div class="task"><h3>${i+1}. ${x}</h3></div>`).join("");$("#total").textContent=S.records.length;$("#streak").textContent=S.streak+"天";$("#records").innerHTML=S.records.slice(-20).reverse().map(r=>`<div class="record"><b>${r.date}</b><br><span class="muted">RP ${r.rp>=0?"+":""}${r.rp}｜🦌 ${r.d}｜研究 ${r.research}｜SV ${r.sv}｜风险 ${r.risk}</span><p>${r.note||""}</p></div>`).join("")||"<p class='muted'>还没有日报。</p>";$("#bossList").innerHTML=Object.entries(S.boss).map(([k,v])=>`<div class="boss"><h3>${k} HP ${v}/100</h3><div class="bar red"><i style="width:${v}%"></i></div><p>${desc(k)}</p></div>`).join("");save()}
function desc(k){return{"高刺激循环":"AI改图、🦌、看盘翻本是同一个刺激回路。","欲望魔神":"天天🦌会回血，0次或止血会掉血。","市场先生":"冲动交易/翻本/杠杆会回血。","伪研究员":"只看盘不输出会回血，研究输出会掉血。","旧日幻影":"旧照和AI幻想扩建会回血。"}[k]}
function go(id){$$(".page").forEach(p=>p.classList.toggle("active",p.id===id));$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.go===id));render();scrollTo({top:0,behavior:"smooth"})}
function done(){let c=current();S.rp+=c[2]=="主线"?5:2;if(c[2]=="止血"){S.risk-=12;S.sv-=10;S.streak++}if(c[2]=="防线"){S.sv-=8;S.boss["旧日幻影"]-=8}if(c[2]=="主线"){S.boss["伪研究员"]-=10}norm();S.now++;toast("完成："+c[0]);render()}
function upMain(i){S.main[i][2]=clamp(S.main[i][2]+10,0,100);S.rp+=3;S.boss["伪研究员"]-=5;norm();toast("主线推进+10%");render()}
function startBleed(){S.risk-=15;S.sv-=15;S.boss["高刺激循环"]-=10;S.streak++;norm();toast("止血启动：离屏20分钟");render()}
function recordRelapse(){S.risk+=15;S.sv+=15;S.boss["高刺激循环"]+=10;S.boss["欲望魔神"]+=12;S.streak=0;norm();toast("已记录，不自欺，下一步止血");render()}
function decision(type){let t={ai:"不删照片，但今天禁止生成新素材。下一步：离屏20分钟，然后燃机研究40分钟。",desire:"先不要争论戒不戒。下一步：手机离手，走20分钟，回来再决定。",trade:"爆仓后禁止翻本。下一步：写100字复盘，不允许加杠杆。",lazy:"只做最低版本：打开燃机主线，推进一个模块10%。"}[type];$("#decisionOut").textContent=t}
function dnum(v){return v=="0次"?0:v=="1次"?1:v=="2次"?2:v=="3次"?3:4}
function rscore(v){return v=="无"?0:v=="阅读"?1:v=="输出300字"?2:v=="更新数据库/PPT"?3:4}
function settle(){let rs=rscore(r.value),dn=dnum(d.value),rp=rs*3;if(dn==0){rp+=5;S.sv-=8;S.boss["欲望魔神"]-=10}else if(dn<=2){S.sv+=dn*5;S.risk+=dn*4}else{rp-=8;S.sv+=15;S.risk+=15;S.boss["欲望魔神"]+=15}if(f.value.includes("AI")||f.value.includes("严重")){rp-=8;S.sv+=15;S.risk+=12;S.boss["旧日幻影"]+=15}else if(f.value.includes("停住")){rp+=3;S.sv-=5}if(t.value.includes("冲动")){rp-=12;S.risk+=20;S.boss["市场先生"]+=20}else if(t.value=="正常看盘")S.risk+=3;if(b.value.includes("20")){rp+=2;S.risk-=8;S.sv-=6}if(b.value.includes("30")){rp+=4;S.risk-=10;S.sv-=8}if(b.value.includes("60")){rp+=6;S.risk-=15;S.sv-=12}S.rp=Math.max(0,S.rp+rp);norm();S.records.push({date:today(),rp,d:dn,research:r.value,rs,sv:S.sv,risk:S.risk,note:note.value});note.value="";toast("已存档");render()}
function norm(){S.sv=clamp(S.sv,0,100);S.risk=clamp(S.risk,0,100);Object.keys(S.boss).forEach(k=>S.boss[k]=clamp(S.boss[k],0,100))}
function askNpc(){let lines=["导师：今天不要研究十家公司，研究懂一个供给环节。","守夜人：你不是要忘掉幻想，你是停止生产新幻想。","纪律官：爆仓后最危险的是想立刻翻本。","档案官：今天只需要留下一条真实记录。"];$("#npcLine").innerHTML=`<h3>${lines[Math.floor(Math.random()*lines.length)]}</h3>`}
function makeGpt(){let obj={系统:"TravelerOS 6.0 Mission Control",日期:today(),主线:"燃气轮机数据库/PPT",当前任务:current(),主线进度:pct()+"%",SV:S.sv,风险:S.risk,本周:wk(),最近记录:S.records.slice(-3),补充:gptNote.value,请求:"请直接给我今天Now/Next/After三步任务，不讲大道理。围绕燃机数据库/PPT、戒🦌、保持心态。"};gptOut.textContent=JSON.stringify(obj,null,2)}
async function copyGpt(){try{await navigator.clipboard.writeText(gptOut.textContent);toast("已复制")}catch(e){toast("复制失败")}}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));saveBtn.onclick=()=>{save();toast("已保存")};startBtn.onclick=()=>toast("开始："+current()[0]);doneBtn.onclick=done;dontKnowBtn.onclick=()=>{S.now=0;render();toast("已派发当前任务")};completeNow?.addEventListener("click",done);rerollNow?.addEventListener("click",()=>{S.now=0;render()});startBleed.onclick=window.startBleed;recordRelapse.onclick=window.recordRelapse;settle.onclick=window.settle;askNpc.onclick=window.askNpc;makeGpt.onclick=window.makeGpt;copyGpt.onclick=window.copyGpt;document.querySelectorAll(".decision").forEach(b=>b.onclick=()=>decision(b.dataset.type))}
